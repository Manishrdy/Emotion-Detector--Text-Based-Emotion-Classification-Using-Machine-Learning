<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Emotion Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <h2 class="text-center mb-4">🔮 Emotion Classifier</h2>
  <form method="POST" action="/">
    <div class="form-floating">
      <textarea class="form-control" name="text" placeholder="Enter text..." style="height: 100px;"></textarea>
      <label for="text">Type your sentence</label>
    </div>
    <button class="btn btn-primary mt-3 w-100">Predict Emotion</button>
  </form>

  {% if prediction %}
  <div class="card mt-4">
    <div class="card-header">Predicted Emotions</div>
    <ul class="list-group list-group-flush">
      {% for model, emotion in prediction.items() %}
        <li class="list-group-item"><strong>{{ model }}:</strong> {{ emotion }}</li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</div>
</body>
</html>
